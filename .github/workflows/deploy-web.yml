name: Deploy web

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: azure-static-web-app-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated SPA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: web-spa
          path: web-spa
      - name: Check deployment inputs
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [[ -z "$DEPLOYMENT_TOKEN" ]]; then
            echo "::error::Run scripts/Setup-Azure.ps1 to configure the production deployment secret."
            exit 1
          fi
          test -f web-spa/index.html
          test -f web-spa/staticwebapp.config.json
          test -d web-spa/_framework
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web-spa
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify the deployed page responds
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$APP_URL/" --output "$RUNNER_TEMP/morse-index.html" &&
              grep -q 'Morse Code Trainer' "$RUNNER_TEMP/morse-index.html"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deployed site did not return the Morse Code Trainer page."
          exit 1
