name: Validate

on:
  workflow_call:
    inputs:
      base-sha:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck
      - name: MSTest with coverage
        run: dotnet test tests/Portable.Tests.slnx -c Release --warnaserror --logger trx --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults
      - name: Media lifecycle tests and JavaScript coverage
        run: node --test --experimental-test-coverage --test-coverage-include='src/**/*.js' --test-coverage-lines=90 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=TestResults/media.lcov tests/browser/*.test.mjs
      - name: PowerShell infrastructure and coverage tests
        shell: pwsh
        run: ./scripts/Test-Scripts.ps1
      - name: Require 90% total and changed shared code line coverage
        env:
          BASE_SHA: ${{ inputs.base-sha }}
        shell: pwsh
        run: |
          $coverageOptions = @{ Lcov = 'TestResults/media.lcov' }
          if ($env:BASE_SHA) { $coverageOptions.Base = $env:BASE_SHA }
          ./scripts/Check-Coverage.ps1 @coverageOptions
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error

  build:
    uses: ./.github/workflows/build.yml
    with:
      run-maui-tests: true

  infrastructure:
    name: Bicep validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.48.1
      - name: Compile infrastructure and parameters
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/morse-infra.json"
          az bicep build-params --file infra/main.bicepparam --outfile "$RUNNER_TEMP/morse-parameters.json"
          az bicep build --file infra/custom-domain.bicep --outfile "$RUNNER_TEMP/morse-domain.json"

  required:
    name: Required checks
    if: always()
    needs: [tests, build, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test, coverage gate, and platform build
        env:
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
        run: test "$TESTS" = success && test "$BUILD" = success && test "$INFRASTRUCTURE" = success
